version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /app/api
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /app/migrate
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/web
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app/migrate
    schedule:
      interval: weekly
