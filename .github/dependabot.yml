version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /infra/envs/dev
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /app/api
      - /app/migrate
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /app/api
      - /app/web
      - /app/migrate
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
